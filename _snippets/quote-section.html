<style>
.quote { display: grid; grid-template-columns: 2fr 1fr; gap: 40px; margin-top: 160px; align-items: end; }
.quote .mark { display: block; font-size: 80px; line-height: 80px; font-weight: 650; }
.person { display: flex; align-items: center; gap: 24px; }
.person .avatar { position: relative; width: 48px; height: 48px; flex-shrink: 0; }
.person .avatar > img { width: 48px; height: 48px; border-radius: 50%; }

.person .who { display: flex; flex-direction: column; }

</style>

<div class="quote">

    <div class="avatar">

      <span class="badge"><img src="assets/favicon-32.png" alt="" /></span>

    <div class="who t-body">
